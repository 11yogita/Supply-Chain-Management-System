{% extends 'base.html' %}

{% block content %}
<h2>Shipment Management</h2>

<form method="POST" class="mb-4">
    <div class="row">
        <div class="col-md-3">
            <select name="order_id" class="form-control" required>
                <option value="">Select Order</option>
                {% for o in orders %}
                <option value="{{ o.order_id }}">Order {{ o.order_id }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3"><input type="date" name="shipment_date" class="form-control"></div>
        <div class="col-md-3"><input type="date" name="delivery_date" class="form-control"></div>
        <div class="col-md-3">
            <select name="shipment_status" class="form-control">
                <option value="Pending">Pending</option>
                <option value="In Transit">In Transit</option>
                <option value="Delivered">Delivered</option>
            </select>
        </div>
    </div><br>
    <button type="submit" class="btn btn-success">Add Shipment</button>
</form>

<table class="table table-bordered">
    <tr>
        <th>ID</th><th>Order ID</th><th>Shipment Date</th><th>Delivery Date</th><th>Status</th>
    </tr>
    {% for s in shipments %}
    <tr>
        <td>{{ s.shipment_id }}</td>
        <td>{{ s.order_id }}</td>
        <td>{{ s.shipment_date }}</td>
        <td>{{ s.delivery_date }}</td>
        <td>{{ s.shipment_status }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
