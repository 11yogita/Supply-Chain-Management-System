{% extends 'base.html' %}

{% block content %}
<h2>Product Management</h2>

<form method="POST" class="mb-4">
    <div class="row">
        <div class="col-md-3"><input type="text" name="product_name" class="form-control" placeholder="Product Name" required></div>
        <div class="col-md-2"><input type="text" name="category" class="form-control" placeholder="Category"></div>
        <div class="col-md-2"><input type="number" step="0.01" name="price" class="form-control" placeholder="Price"></div>
        <div class="col-md-2">
            <select name="supplier_id" class="form-control" required>
                <option value="">Select Supplier</option>
                {% for s in suppliers %}
                <option value="{{ s.supplier_id }}">{{ s.supplier_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3"><input type="text" name="description" class="form-control" placeholder="Description"></div>
    </div><br>
    <button type="submit" class="btn btn-success">Add Product</button>
</form>

<table class="table table-bordered">
    <tr>
        <th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Supplier ID</th><th>Description</th>
    </tr>
    {% for p in products %}
    <tr>
        <td>{{ p.product_id }}</td>
        <td>{{ p.product_name }}</td>
        <td>{{ p.category }}</td>
        <td>{{ p.price }}</td>
        <td>{{ p.supplier_id }}</td>
        <td>{{ p.description }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
