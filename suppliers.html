{% extends 'base.html' %}

{% block content %}
<h2>Supplier Management</h2>

<form method="POST" class="mb-4">
    <div class="row">
        <div class="col-md-4"><input type="text" name="supplier_name" class="form-control" placeholder="Supplier Name" required></div>
        <div class="col-md-4"><input type="text" name="contact_person" class="form-control" placeholder="Contact Person"></div>
        <div class="col-md-4"><input type="text" name="phone" class="form-control" placeholder="Phone"></div>
    </div><br>
    <div class="row">
        <div class="col-md-4"><input type="email" name="email" class="form-control" placeholder="Email"></div>
        <div class="col-md-4"><input type="text" name="address" class="form-control" placeholder="Address"></div>
        <div class="col-md-4"><button type="submit" class="btn btn-primary">Add Supplier</button></div>
    </div>
</form>

<table class="table table-bordered">
    <tr>
        <th>ID</th><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Address</th>
    </tr>
    {% for s in suppliers %}
    <tr>
        <td>{{ s.supplier_id }}</td>
        <td>{{ s.supplier_name }}</td>
        <td>{{ s.contact_person }}</td>
        <td>{{ s.phone }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.address }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
