{% extends 'base.html' %}

{% block content %}
<h2>Order Management</h2>

<form method="POST" class="mb-4">
    <div class="row">
        <div class="col-md-3">
            <select name="customer_id" class="form-control" required>
                <option value="">Select Customer</option>
                {% for c in customers %}
                <option value="{{ c.customer_id }}">{{ c.customer_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3"><input type="date" name="order_date" class="form-control"></div>
        <div class="col-md-3"><input type="number" step="0.01" name="total_amount" class="form-control" placeholder="Total Amount"></div>
        <div class="col-md-3">
            <select name="status" class="form-control">
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Delivered">Delivered</option>
            </select>
        </div>
    </div><br>
    <button type="submit" class="btn btn-primary">Add Order</button>
</form>

<table class="table table-bordered">
    <tr>
        <th>ID</th><th>Customer ID</th><th>Order Date</th><th>Total Amount</th><th>Status</th>
    </tr>
    {% for o in orders %}
    <tr>
        <td>{{ o.order_id }}</td>
        <td>{{ o.customer_id }}</td>
        <td>{{ o.order_date }}</td>
        <td>{{ o.total_amount }}</td>
        <td>{{ o.status }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
